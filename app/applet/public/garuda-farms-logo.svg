<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Montserrat:wght@600;700&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 0.22em;
        fill: #143823;
      }
      .brand-sub {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.42em;
        fill: #BFA054;
      }
      .brand-pillar {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #143823;
      }
    </style>
    <clipPath id="fieldClip">
      <circle cx="300" cy="220" r="115" />
    </clipPath>
  </defs>

  <!-- Optional Background (transparent or can be toggled) -->
  <rect width="600" height="600" fill="none" />

  <!-- LOGO EMBLEM GROUP (Centered at 300, 220) -->
  <g transform="translate(0, 5)">
    <!-- Golden Sun Arc Ring (Top-Right Arc) -->
    <path 
      d="M 252 148 C 285 130 338 135 372 165 C 400 190 410 226 398 262" 
      fill="none" 
      stroke="#BFA054" 
      stroke-width="5.5" 
      stroke-linecap="round" 
    />

    <!-- Botanical Wheat / Olive Sprig (Right side, curling upwards) -->
    <!-- Central Branch -->
    <path 
      d="M 366 312 C 378 285 386 250 388 220 C 389 205 385 190 383 182" 
      fill="none" 
      stroke="#2D5A3C" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
    <!-- Leaves along the branch -->
    <!-- Top Leaf -->
    <path d="M 383 182 C 384 172 388 165 391 160 C 392 170 388 178 383 182 Z" fill="#2D5A3C" />
    <!-- Leaf pair 1 (upper) -->
    <path d="M 385 196 C 395 190 405 190 410 193 C 404 200 394 202 385 196 Z" fill="#2D5A3C" />
    <path d="M 386 208 C 376 202 368 202 364 206 C 370 213 379 213 386 208 Z" fill="#2D5A3C" />
    <!-- Leaf pair 2 (mid) -->
    <path d="M 387 228 C 398 223 408 225 412 230 C 406 236 396 236 387 228 Z" fill="#2D5A3C" />
    <path d="M 385 242 C 375 237 366 238 362 243 C 368 249 377 248 385 242 Z" fill="#2D5A3C" />
    <!-- Leaf pair 3 (lower) -->
    <path d="M 380 264 C 392 260 402 264 406 270 C 399 274 389 272 380 264 Z" fill="#2D5A3C" />
    <path d="M 374 278 C 365 272 356 274 353 280 C 359 285 367 283 374 278 Z" fill="#2D5A3C" />

    <!-- Furrowed Farm Soil / Ploughed Fields (Gold bands at base of emblem) -->
    <g clip-path="url(#fieldClip)">
      <!-- Furrow 1 (lowest) -->
      <path d="M 280 326 C 310 326 345 315 375 292 L 385 304 C 350 328 310 338 275 338 Z" fill="#BFA054" />
      <!-- Furrow 2 -->
      <path d="M 288 312 C 315 311 345 301 370 280 L 378 290 C 350 311 315 321 285 322 Z" fill="#BFA054" />
      <!-- Furrow 3 -->
      <path d="M 298 298 C 322 296 346 287 364 269 L 372 277 C 350 295 322 305 295 307 Z" fill="#BFA054" />
      <!-- Furrow 4 (uppermost horizon line) -->
      <path d="M 310 286 C 328 283 346 275 358 260 L 364 266 C 350 281 330 289 308 292 Z" fill="#BFA054" />
    </g>

    <!-- EAGLE SILHOUETTE (Deep Forest Green #143823) -->
    <!-- Left Wing Feathers (curving gracefully upwards and back) -->
    <!-- Top Wing Tip 1 -->
    <path d="M 190 128 C 195 145 204 165 220 182 C 205 168 195 150 189 128 Z" fill="#143823" />
    <path d="M 190 128 C 200 155 218 190 248 212 C 228 192 210 162 190 128 Z" fill="#143823" />
    <!-- Wing Feather 2 -->
    <path d="M 190 160 C 202 182 220 206 244 224 C 224 206 208 184 190 160 Z" fill="#143823" />
    <!-- Wing Feather 3 -->
    <path d="M 190 192 C 205 212 225 230 246 242 C 224 226 208 208 190 192 Z" fill="#143823" />
    <!-- Wing Feather 4 -->
    <path d="M 195 224 C 210 238 230 252 250 260 C 230 248 214 236 195 224 Z" fill="#143823" />

    <!-- Main Eagle Body & Head -->
    <path 
      d="M 190 128 
         C 202 165 228 200 252 215
         C 246 198 252 180 262 168
         C 275 174 290 178 306 178
         C 324 178 340 184 348 196
         C 345 200 340 202 334 202
         C 344 204 350 210 345 224
         C 338 220 330 216 322 216
         C 310 216 295 228 288 244
         C 280 260 278 280 286 296
         C 270 288 260 272 258 252
         C 250 272 256 296 270 312
         C 252 304 240 286 238 266
         C 230 284 236 306 250 324
         C 232 316 220 298 218 276
         C 210 296 218 322 238 340
         C 214 326 200 298 204 268
         C 194 286 198 312 216 332
         C 192 312 182 278 190 244
         C 184 258 184 280 196 300
         C 180 274 178 240 190 206
         Z" 
      fill="#143823" 
    />

    <!-- Eagle Detailed Head, Beak & Neck Contour -->
    <path 
      d="M 252 170
         C 270 172 290 178 310 178
         C 328 178 344 186 352 198
         C 346 202 340 202 334 202
         C 346 205 352 214 346 228
         C 336 222 328 218 318 218
         C 298 218 282 234 274 256
         C 264 278 264 304 278 324
         C 258 312 244 290 242 264
         C 232 284 238 310 254 330
         C 230 318 218 292 220 264
         C 208 244 212 216 228 196
         C 238 184 246 176 252 170
         Z"
      fill="#143823"
    />

    <!-- Eagle Beak Sharp Hook -->
    <path 
      d="M 324 190 
         C 338 192 348 198 354 206 
         C 356 214 354 222 348 228 
         C 346 222 344 216 338 214 
         C 330 212 324 212 318 212 
         C 322 205 324 198 324 190 
         Z" 
      fill="#143823" 
    />

    <!-- Eagle Eye (Sharp fierce cream triangular eye & slit) -->
    <path d="M 302 196 C 308 194 316 196 322 200 C 314 202 308 200 302 196 Z" fill="#FAF8F2" />
    <circle cx="312" cy="198" r="2.2" fill="#143823" />
    <path d="M 298 194 C 306 191 318 193 325 198" fill="none" stroke="#143823" stroke-width="2.5" stroke-linecap="round" />

    <!-- Circular Enclosure Bottom Curve (Eagle neck feathers completing circle) -->
    <path 
      d="M 218 276
         C 224 330 270 366 330 366
         C 354 366 376 358 394 344
         C 374 354 348 358 326 358
         C 275 358 235 328 226 280
         Z" 
      fill="#143823" 
    />
  </g>

  <!-- BRAND NAME "GARUDA" WITH GOLDEN ACCENT BRIDGES OVER 'A's -->
  <g transform="translate(300, 420)">
    <text text-anchor="middle" class="brand-title">GARUDA</text>
    <!-- Golden curved arch bridge over First 'A' (approx x = -106 to -66, y = -36) -->
    <path d="M -112 -38 Q -88 -54 -64 -38" fill="none" stroke="#BFA054" stroke-width="3.5" stroke-linecap="round" />
    <!-- Golden curved arch bridge over Second 'A' (approx x = 168 to 208, y = -36) -->
    <path d="M 166 -38 Q 190 -54 214 -38" fill="none" stroke="#BFA054" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- BRAND SUBTITLE "—— F A R M S ——" -->
  <g transform="translate(300, 462)">
    <!-- Left horizontal rule -->
    <line x1="-220" y1="-8" x2="-85" y2="-8" stroke="#BFA054" stroke-width="1.8" />
    <!-- Text -->
    <text text-anchor="middle" class="brand-sub">FARMS</text>
    <!-- Right horizontal rule -->
    <line x1="85" y1="-8" x2="220" y2="-8" stroke="#BFA054" stroke-width="1.8" />
  </g>

  <!-- DIVIDER LINE -->
  <line x1="80" y1="492" x2="520" y2="492" stroke="#E5D9C3" stroke-width="1" />

  <!-- BRAND THREE PILLARS AT BOTTOM -->
  <!-- 1. Pure By Nature -->
  <g transform="translate(135, 515)">
    <!-- Circle with leaves icon -->
    <circle cx="-16" cy="-4" r="10" fill="none" stroke="#143823" stroke-width="1.5" />
    <path d="M -20 -1 C -19 -7 -14 -8 -13 -8 C -13 -3 -15 0 -20 -1 Z" fill="#143823" />
    <path d="M -13 -6 C -9 -8 -7 -5 -9 -2 C -11 -2 -12 -4 -13 -6 Z" fill="#143823" />
    <text x="0" y="0" class="brand-pillar">PURE BY NATURE</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="228" y1="504" x2="228" y2="522" stroke="#BFA054" stroke-width="1" />

  <!-- 2. Ethical By Choice -->
  <g transform="translate(300, 515)">
    <!-- Shield with checkmark icon -->
    <path d="M -18 -11 L -8 -11 C -8 -4 -11 1 -13 4 C -15 1 -18 -4 -18 -11 Z" fill="none" stroke="#BFA054" stroke-width="1.5" />
    <path d="M -16 -4 L -13 -1 L -9 -7" fill="none" stroke="#BFA054" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="-2" y="0" class="brand-pillar">ETHICAL BY CHOICE</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="392" y1="504" x2="392" y2="522" stroke="#BFA054" stroke-width="1" />

  <!-- 3. Grown With Care -->
  <g transform="translate(465, 515)">
    <!-- Heart handshake icon -->
    <path d="M -16 -5 C -19 -10 -11 -12 -8 -7 C -5 -12 3 -10 0 -5 C -3 0 -8 4 -8 4 C -8 4 -13 0 -16 -5 Z" fill="none" stroke="#143823" stroke-width="1.4" />
    <text x="8" y="0" class="brand-pillar">GROWN WITH CARE</text>
  </g>
</svg>
